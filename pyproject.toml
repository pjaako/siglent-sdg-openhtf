[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siglent-sdg-openhtf"
version = "0.1.0"
description = "OpenHTF plug for the Siglent SDG2042X arbitrary waveform generator (SDG2000X family), over SCPI via PyVISA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "openhtf>=1.6.1,<2",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

[project.optional-dependencies]
usb = ["pyusb"]

[dependency-groups]
dev = ["pytest", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/siglent_sdg_openhtf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# T5 must add "example_test.py" and "tools" here when it creates them: mypy fails on a missing path.
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openhtf", "openhtf.*", "pyvisa", "pyvisa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "example_test"]
disallow_untyped_decorators = false
